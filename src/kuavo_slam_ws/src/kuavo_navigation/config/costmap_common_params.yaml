obstacle_range: 2.5
raytrace_range: 3.0
robot_radius: 0.3

cost_scaling_factor: 8

inflation_layer:
  inflation_radius: 1.2

transform_tolerance: 0.5
observation_sources: laser_scan_sensor point_cloud_sensor

laser_scan_sensor:
  sensor_frame: livox_frame
  data_type: LaserScan
  topic: /livox/scan
  marking: true
  clearing: true
  max_obstacle_height: 0.4
  min_obstacle_height: 0.08

point_cloud_sensor:
  sensor_frame: livox_frame
  data_type: PointCloud2
  topic: /livox/cloud
  marking: true
  clearing: true
  max_obstacle_height: 0.4
  min_obstacle_height: 0.08

